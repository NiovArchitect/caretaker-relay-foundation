# Render Blueprint — Caretaker Relay Care API (focused care-app)
#
# Isolated product. Do NOT point at Otzar production databases or secrets.
#
# Apply from: caretaker-relay-foundation repo
# Branch: set to the branch you deploy (e.g. checkpoint/caretaker-relay-track1-2026-07-22
# or a dedicated deploy branch). Secrets: paste in Render dashboard (sync: false).
#
# Health: GET /api/v1/health

services:
  - type: web
    runtime: docker
    name: caretaker-relay-care-api
    branch: checkpoint/caretaker-relay-track1-2026-07-22
    rootDir: .
    dockerfilePath: ./Dockerfile.care
    dockerContext: .
    healthCheckPath: /api/v1/health
    plan: starter
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PRODUCT_ID
        value: caretaker-relay
      - key: PRODUCT_NAMESPACE
        value: cr
      - key: AUDIT_PRODUCT_TAG
        value: caretaker-relay
      - key: PORT
        value: "3100"
      # Prefer llm when a provider key is configured in dashboard.
      # Grok (xAI): LLM_PROVIDER=xai + XAI_API_KEY (+ optional XAI_MODEL=grok-3).
      # Also requires CARE_DEPLOYMENT_MODE=regulated_ai_enabled with
      # CARE_AI_BAA_EXECUTED=1 and CARE_AI_PHI_ALLOWED=1 (or live AI stays disabled).
      # Set CARE_UNDERSTAND_MODE=fixture only for deterministic lab.
      - key: CARE_UNDERSTAND_MODE
        value: llm
      - key: LLM_PROVIDER
        value: xai
      - key: CARE_DEPLOYMENT_MODE
        value: regulated_ai_enabled
      - key: CARE_AI_BAA_EXECUTED
        sync: false
      - key: CARE_AI_PHI_ALLOWED
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-3
      - key: XAI_BASE_URL
        value: https://api.x.ai/v1
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CARE_STORE_BACKEND
        value: prisma
      # Public HTTPS origin of the caregiver UI (required for browser CORS)
      - key: CARETAKER_APP_URL
        sync: false
      - key: CARE_CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
