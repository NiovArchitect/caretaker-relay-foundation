# Render Blueprint — Caretaker Relay Foundation API
#
# Separate product from Otzar. Do not point this service at Otzar databases,
# Redis, secrets, OAuth apps, or domains.
#
# Secrets are NOT in this file (sync: false). Paste in Render dashboard.

services:
  - type: web
    runtime: docker
    name: caretaker-relay-api
    branch: main
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    plan: starter
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLOUD_TARGET
        value: production
      - key: PRODUCT_ID
        value: caretaker-relay
      - key: PRODUCT_NAMESPACE
        value: cr
      - key: AUDIT_PRODUCT_TAG
        value: caretaker-relay
      - key: REDIS_KEY_PREFIX
        value: "cr:"
      - key: ENCRYPTION_NAMESPACE
        value: caretaker-relay
      - key: VOICE_STT_PROVIDER
        value: elevenlabs
      - key: ELEVENLABS_STT_MODEL
        value: scribe_v1
      # Application URL for Caretaker Relay UI (not Otzar Control Tower)
      - key: CARETAKER_APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CARETAKER_RELAY_ENTITY_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
