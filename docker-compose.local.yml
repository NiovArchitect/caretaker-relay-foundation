# Local-development docker compose — Caretaker Relay Foundation
#
# Isolated from Otzar / niov-foundation local stacks:
#   - postgres on 5434 (not 5433)
#   - database caretaker_relay_dev
#   - containers prefixed cr-local-*
#   - API on 3100 (not 3000)
#
# Boot:
#   docker compose -f docker-compose.local.yml up --build -d
#
# Tear down:
#   docker compose -f docker-compose.local.yml down -v

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-trixie
    container_name: cr-local-pg
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: caretaker
      POSTGRES_PASSWORD: caretaker_local_only
      POSTGRES_DB: caretaker_relay_dev
    volumes:
      - cr_local_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caretaker -d caretaker_relay_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  foundation-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cr-local-foundation-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      python-intelligence:
        condition: service_started
      collaboration-supervisor:
        condition: service_started
    ports:
      - "3100:3100"
    environment:
      PRODUCT_ID: caretaker-relay
      PRODUCT_NAMESPACE: cr
      PORT: "3100"
      DATABASE_URL: postgresql://caretaker:caretaker_local_only@postgres:5432/caretaker_relay_dev
      DIRECT_URL: postgresql://caretaker:caretaker_local_only@postgres:5432/caretaker_relay_dev
      JWT_SECRET: cr-local-dev-jwt-secret-not-for-production
      ENCRYPTION_KEY: cr-local-dev-encryption-key-32b!
      ENCRYPTION_NAMESPACE: caretaker-relay
      REDIS_KEY_PREFIX: "cr:"
      CORS_ORIGIN: http://localhost:5180
      PUBLIC_APP_URL: http://localhost:3100
      CARETAKER_APP_URL: http://localhost:5180
      LOG_LEVEL: info
      AUDIT_LOG_LEVEL: info
      AUDIT_PRODUCT_TAG: caretaker-relay
      METRICS_ENABLED: "false"
      CONNECTOR_WRITE_ENABLED: "false"
      PAYMENT_RAILS_ENABLED: "false"
      LIVE_MIC_CAPTURE_ENABLED: "false"
      RAW_AUDIO_RETENTION_ENABLED: "false"
      PYTHON_INTELLIGENCE_RUNTIME_URL: http://python-intelligence:8000
      PYTHON_RUNTIME_ENABLED: "true"
      BEAM_RUNTIME_URL: http://collaboration-supervisor:4001
      BEAM_RUNTIME_ENABLED: "true"

  python-intelligence:
    build:
      context: ./services/python-intelligence
    container_name: cr-local-python-intelligence
    restart: unless-stopped
    ports:
      - "8100:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  collaboration-supervisor:
    build:
      context: .
      dockerfile: apps/collaboration_supervisor/Dockerfile
    container_name: cr-local-collaboration-supervisor
    restart: unless-stopped
    ports:
      - "4101:4001"
    environment:
      COLLAB_SUPERVISOR_PORT: "4001"
      PRODUCT_ID: caretaker-relay
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  cr_local_pg:
    name: cr-local-pg-data
